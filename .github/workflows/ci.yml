name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  DATABASE_URL: postgres://talent_os:talent_os_test@localhost:5432/talent_os_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci_test_secret_that_is_long_enough_for_hmac_256_validation
  CORS_ORIGIN: http://localhost:3000

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: apps/api-rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talent_os_test
          POSTGRES_USER: talent_os
          POSTGRES_PASSWORD: talent_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talent_os -d talent_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust
      - name: Run tests
        run: cargo test --all --verbose

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --filter frontend exec tsc --noEmit
      - name: Lint
        run: pnpm --filter frontend exec eslint .

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter frontend run build

  packages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build

  e2e-tests:
    runs-on: ubuntu-latest
    if: false  # Disabled until backend boot step is wired (see CONTRIBUTING.md)
    needs: [frontend-build, backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talent_os_test
          POSTGRES_USER: talent_os
          POSTGRES_PASSWORD: talent_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talent_os -d talent_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Rust security audit
        working-directory: apps/api-rust
        # Ignored advisories should each have a tracking issue. Audit
        # quarterly and prune.
        run: >-
          cargo audit
          --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2026-0002
          --ignore RUSTSEC-2024-0421
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0370
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: NPM security audit
        working-directory: apps/web
        run: pnpm audit --prod --audit-level=high
