# Lefthook is run via `pnpx lefthook install` once after cloning the repo.
# Each hook runs only on staged files matching the glob, in parallel where
# possible. Use `git commit --no-verify` to skip in emergencies (the audit
# log records who did this).

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "apps/web/**/*.{ts,tsx,js,jsx,mjs}"
      # Resolve staged paths relative to apps/web before invoking eslint
      # (the frontend workspace), and rely on eslint to no-op if the
      # filter passed in zero files.
      root: "apps/web"
      run: pnpm exec eslint --max-warnings 0 {staged_files}
    tsc-web:
      glob: "apps/web/**/*.{ts,tsx}"
      root: "apps/web"
      # tsc is project-wide, not per-file, so we always run the whole check
      # when any TS file is staged. Fast enough on Next 16.
      run: pnpm exec tsc --noEmit
    tsc-contracts:
      glob: "packages/contracts/**/*.ts"
      root: "packages/contracts"
      run: pnpm exec tsc --noEmit
    rust-fmt:
      glob: "apps/api-rust/**/*.rs"
      run: cargo fmt --manifest-path apps/api-rust/Cargo.toml -- --check {staged_files}
    rust-clippy:
      glob: "apps/api-rust/**/*.rs"
      # clippy is workspace-wide; run on the whole crate when any rs file
      # is staged. Cached, so subsequent runs are fast.
      run: cargo clippy --manifest-path apps/api-rust/Cargo.toml --all-targets -- -D warnings

commit-msg:
  commands:
    enforce-length:
      run: |
        # 1st line should be <=72 chars to match standard git tooling.
        head -1 {1} | awk 'length > 72 { exit 1 }' || { echo "Commit subject too long (>72 chars)"; exit 1; }

pre-push:
  parallel: true
  commands:
    audit-cargo:
      run: |
        if command -v cargo-audit >/dev/null 2>&1; then
          cargo audit --manifest-path apps/api-rust/Cargo.toml --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2024-0421 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0370
        else
          echo "skipping cargo-audit (not installed; run: cargo install cargo-audit)"
        fi
